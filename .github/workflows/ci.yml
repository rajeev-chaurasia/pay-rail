name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - name: Repository style and secret-file guard
        run: python3 scripts/check_style.py --self-test
      - name: Format, test and package
        run: mvn --batch-mode verify
      - name: Validate retained experiment evidence
        run: python3 scripts/validate_concurrency_evidence.py --self-test
      - name: Validate Compose configuration
        run: docker compose -p payrail config --quiet
      - name: Check shell syntax
        run: bash -n scripts/*.sh
