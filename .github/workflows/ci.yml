name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build pinned verification toolchain
        run: docker compose -p payrail --profile test build verify
      - name: Verify sources, real infrastructure tests and retained evidence
        run: docker compose -p payrail --profile test run --rm verify
      - name: Build runtime and reject known high or critical vulnerabilities
        run: docker compose -p payrail build app && ./scripts/security-scan.sh
