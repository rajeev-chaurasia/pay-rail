name: payrail
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: payrail
      POSTGRES_USER: payrail
      POSTGRES_PASSWORD: payrail
    ports: ["127.0.0.1:${PAYRAIL_POSTGRES_PORT:-15432}:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U payrail"], interval: 2s, timeout: 2s, retries: 30}
    volumes: ["payrail-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${PAYRAIL_REDIS_PORT:-16379}:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 2s, timeout: 2s, retries: 30}
  kafka:
    image: apache/kafka:3.9.0
    ports: ["127.0.0.1:${PAYRAIL_KAFKA_PORT:-19092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${PAYRAIL_KAFKA_PORT:-19092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck: {test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"], interval: 5s, timeout: 5s, retries: 30}
  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/payrail
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports: ["127.0.0.1:${PAYRAIL_HTTP_PORT:-18080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
  verify:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - payrail-maven-cache:/root/.m2
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      DOCKER_HOST: unix:///var/run/docker.sock
      PAYRAIL_HOST_WORKSPACE: ${PWD}
      PAYRAIL_CONTAINERIZED: "true"
      PAYRAIL_URL: http://app:8080

volumes:
  payrail-postgres: {}
  payrail-maven-cache: {}
